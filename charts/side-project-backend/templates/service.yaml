apiVersion: v1
kind: Service
metadata:
  name: {{ include "side-project-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "side-project-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "side-project-backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

    # Prometheus 전용 ClusterIP 포트이며 Ingress에서는 사용하지 않습니다.
    - name: metrics
      protocol: TCP
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
