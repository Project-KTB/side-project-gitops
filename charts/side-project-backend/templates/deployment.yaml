apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "side-project-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "side-project-backend.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.deployment.progressDeadlineSeconds }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.strategy.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.maxUnavailable }}

  selector:
    matchLabels:
      {{- include "side-project-backend.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        side-project.shop/rollout-revision: {{ .Values.deployment.rolloutRevision | quote }}
      labels:
        {{- include "side-project-backend.selectorLabels" . | nindent 8 }}

    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}

      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          nodeTaintsPolicy: {{ .Values.topologySpreadConstraints.nodeTaintsPolicy }}

          labelSelector:
            matchLabels:
              {{- include "side-project-backend.selectorLabels" . | nindent 14 }}
      {{- end }}

      containers:
        - name: {{ .Values.container.name }}

          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          # Prometheus가 Actuator 메트릭을 수집하는 내부 관리 포트입니다.
            - name: metrics
              containerPort: {{ .Values.container.metricsPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "side-project-backend.configMapName" . }}

            - secretRef:
                name: {{ required "existingSecret 값이 필요합니다." .Values.existingSecret }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep {{ .Values.deployment.preStopSleepSeconds }}"
