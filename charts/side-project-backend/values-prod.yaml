image:
  # 초기 GitOps 배포에 사용할 v1 이미지입니다.
  tag: "2e560cced7b7f2a58b3228880a878867d2ee08ff"
config:
  APP_CORS_ALLOWED_ORIGINS: "https://app.side-project.shop"
  APP_IMAGE_STORAGE_S3_BUCKET: "side-project-images-s3"
  APP_IMAGE_STORAGE_S3_PRESIGNED_URL_DURATION_SECONDS: "300"
  APP_IMAGE_STORAGE_S3_PUBLIC_URL_PREFIX: "https://side-project-images-s3.s3.ap-northeast-2.amazonaws.com"
  APP_IMAGE_STORAGE_S3_REGION: "ap-northeast-2"
  APP_IMAGE_STORAGE_TYPE: "s3"
  APP_IMAGE_UPLOAD_ENABLED: "true"
  APP_REFRESH_COOKIE_DOMAIN: ""
  APP_REFRESH_COOKIE_SAME_SITE: "Lax"
  APP_REFRESH_COOKIE_SECURE: "true"
  APP_SEED_ENABLED: "false"
  COOKIE_DOMAIN: ".side-project.shop"
  HOST_BACKEND_PORT: "8080"
  JPA_DDL_AUTO: "none"
  JWT_ACCESS_TOKEN_EXP_SECONDS: "300"
  JWT_REFRESH_TOKEN_EXP_SECONDS: "1209600"
  SPRING_PROFILES_ACTIVE: "prod"
ingress:
  # 운영 환경에서만 Ingress를 생성합니다.
  enabled: true
  # 현재 설치된 ingress-nginx Controller를 사용합니다.
  className: nginx
  # 현재는 별도 annotation이나 경로 재작성을 사용하지 않습니다.
  annotations: {}
  hosts:
    - host: api.side-project.shop
      paths:
        # Spring Boot Context Path가 /api이므로 경로를 그대로 전달합니다.
        - path: /api
          pathType: Prefix
  # 우선 HTTP 라우팅을 확인하고 TLS는 이후 구성합니다.
  tls: []

serviceMonitor:
  enabled: true
