apiVersion: v1
kind: Service
metadata:
  name: side-project-backend
  namespace: side-project
  labels:
    app.kubernetes.io/name: side-project-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: side-project-backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
