apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: aws-ebs-csi-driver
  namespace: argocd

  # Application 삭제 시 관리하던 EBS CSI 리소스도 함께 정리합니다.
  # PVC 사용 중에는 이 Application을 삭제하면 안 됩니다.
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  # EBS CSI Wrapper Helm Chart가 저장된 Git 경로입니다.
  source:
    repoURL: https://github.com/Project-KTB/side-project-gitops.git
    targetRevision: main
    path: platform/storage/aws-ebs-csi-driver

    helm:
      releaseName: aws-ebs-csi-driver

  # EBS CSI Driver는 kube-system Namespace에 설치합니다.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  # 기존 백엔드 Application과 동일하게 수동 동기화합니다.
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false

    syncOptions:
      - CreateNamespace=false
