apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: side-project-backend
  namespace: argocd

  # Application 삭제 시 Argo CD가 관리하던 리소스도 함께 정리합니다.
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  # Argo CD 기본 Project를 사용합니다.
  project: default

  # Argo CD가 감시할 Git 저장소와 Helm Chart 위치입니다.
  source:
    repoURL: https://github.com/Project-KTB/side-project-gitops.git
    targetRevision: main
    path: charts/side-project-backend

    helm:
      releaseName: side-project-backend
      valueFiles:
        - values-prod.yaml

  # 현재 Argo CD가 설치된 Kubernetes 클러스터에 배포합니다.
  destination:
    server: https://kubernetes.default.svc
    namespace: side-project

  # Git 변경 사항을 자동으로 클러스터에 반영합니다.
  syncPolicy:
    automated:
      # Git 변경을 감지하더라도 자동으로 배포하지 않습니다.
      enabled: false

      # Git에서 리소스가 삭제돼도 자동으로 제거하지 않습니다.
      prune: false

      # 클러스터의 수동 변경을 자동 복구하지 않습니다.
      selfHeal: false

    syncOptions:
      - CreateNamespace=true
