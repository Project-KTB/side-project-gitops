{{- if .Values.storageClass.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  annotations:
    storageclass.kubernetes.io/is-default-class: {{ .Values.storageClass.default | quote }}
provisioner: ebs.csi.aws.com
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
parameters:
  type: {{ .Values.storageClass.parameters.type | quote }}
  encrypted: {{ .Values.storageClass.parameters.encrypted | quote }}
  csi.storage.k8s.io/fstype: {{ .Values.storageClass.parameters.fsType | quote }}
{{- end }}
